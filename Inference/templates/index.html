<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>熱顯像人體即時辨識系統</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f4f4f9; 
            color: #333; 
            text-align: center; 
            padding: 20px; 
            margin: 0;
        }
        h1 { color: #2c3e50; margin-bottom: 5px; }
        p.subtitle { color: #7f8c8d; margin-bottom: 30px; }
        
        /* 新增：展示技術深度的標籤 */
        .tech-badge {
            display: inline-block;
            background-color: #27ae60;
            color: white;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .upload-section { 
            margin: 0 auto 30px auto; 
            padding: 30px; 
            background: white; 
            width: 50%; 
            min-width: 300px;
            border-radius: 10px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
        }
        input[type="file"] { margin-bottom: 15px; font-size: 16px; }
        button { 
            background-color: #e74c3c; 
            color: white; 
            border: none; 
            padding: 12px 24px; 
            border-radius: 5px; 
            cursor: pointer; 
            font-size: 16px; 
            font-weight: bold;
            transition: background-color 0.3s;
        }
        button:hover { background-color: #c0392b; }
        .video-container { margin-top: 20px; }
        h3 { color: #e74c3c; animation: blink 1.5s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        
        img.stream { 
            max-width: 80%; 
            border: 5px solid #34495e; 
            border-radius: 10px; 
            box-shadow: 0 10px 20px rgba(0,0,0,0.2); 
            background-color: #000;
        }
    </style>
</head>
<body>

    <h1>🚁 DJI 空拍機熱顯像辨識系統</h1>
    <p class="subtitle">雙重模型推論 (YOLOv11 + EfficientNet)</p>
    
    <div class="tech-badge">✔️ 內部雙流處理啟動：Bilateral Filter & CLAHE 動態降噪</div>
    
    <div class="upload-section">
        <p><b>請上傳熱顯像影片檔 (.mp4, .avi) 進行即時分析</b></p>
        <form action="/" method="POST" enctype="multipart/form-data">
            <input type="file" name="video_file" accept="video/*" required>
            <br>
            <button type="submit">開始即時辨識</button>
        </form>
    </div>

    {% if video_name %}
    <div class="video-container">
        <h3>🔴 即時推論畫面播放中...</h3>
        <img class="stream" src="{{ url_for('video_feed', filename=video_name) }}" alt="即時影像串流">
    </div>
    {% endif %}

</body>
</html>
